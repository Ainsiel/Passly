name: passly

x-healthcheck-defaults: &healthcheck-defaults
  interval: 15s
  timeout: 10s
  retries: 10
  start_period: 10s

services:
  postgres:
    image: postgres:17-alpine
    container_name: passly-postgres
    environment:
      POSTGRES_USER: passly
      POSTGRES_PASSWORD: passly
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passly -d postgres"]
      <<: *healthcheck-defaults
      interval: 10s
      timeout: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: passly-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q "UP" <&3']
      <<: *healthcheck-defaults
      retries: 20
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4.3.4-management-alpine
    container_name: passly-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: passly
      RABBITMQ_DEFAULT_PASS: passly
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      <<: *healthcheck-defaults
      start_period: 20s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: passly-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8025/api/v2/messages || exit 1"]
      <<: *healthcheck-defaults
      timeout: 5s

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: passly-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
      <<: *healthcheck-defaults

  grafana:
    image: grafana/grafana-oss:11.6.0
    container_name: passly-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health > /dev/null || exit 1"]
      <<: *healthcheck-defaults

volumes:
  postgres-data:
  keycloak-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
