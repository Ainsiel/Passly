name: passly

x-healthcheck-defaults: &healthcheck-defaults
  interval: 15s
  timeout: 10s
  retries: 10
  start_period: 10s

x-app-healthcheck: &app-healthcheck
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 20s

services:
  # --- Núcleo (siempre encendido para desarrollo local) ---
  postgres:
    image: postgres:17-alpine
    container_name: passly-postgres
    environment:
      POSTGRES_USER: passly
      POSTGRES_PASSWORD: passly
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passly -d postgres"]
      <<: *healthcheck-defaults
      interval: 10s
      timeout: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: passly-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q "UP" <&3']
      <<: *healthcheck-defaults
      retries: 20
      start_period: 30s

  catalog-service:
    build: ../services/catalog-service
    container_name: passly-catalog
    environment:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/passly
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/passly/protocol/openid-connect/certs
      PASSLY_CATALOG_DB_URL: jdbc:postgresql://postgres:5432/catalog
      PASSLY_CATALOG_DB_USER: passly
      PASSLY_CATALOG_DB_PASSWORD: passly
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health || exit 1"]
      <<: *app-healthcheck
      start_period: 30s

  gateway:
    build: ../services/gateway
    container_name: passly-gateway
    environment:
      PASSLY_CATALOG_URI: http://catalog-service:8081
    ports:
      - "8090:8090"
    depends_on:
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8090/actuator/health || exit 1"]
      <<: *app-healthcheck
      start_period: 30s

  web:
    build: ../apps/web
    container_name: passly-web
    environment:
      HOSTNAME: "0.0.0.0"
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET es obligatorio (se genera en infra/.env)}
      AUTH_KEYCLOAK_ID: passly-web
      AUTH_KEYCLOAK_SECRET: "passly-web-secret"
      AUTH_KEYCLOAK_ISSUER: http://localhost:8080/realms/passly
      AUTH_KEYCLOAK_AUTH_URL: http://localhost:8080/realms/passly/protocol/openid-connect/auth
      AUTH_KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/passly/protocol/openid-connect/token
      AUTH_KEYCLOAK_USERINFO_URL: http://keycloak:8080/realms/passly/protocol/openid-connect/userinfo
      PASSLY_CATALOG_URL: http://gateway:8090/api/catalog
      PASSLY_CATALOG_ME_URL: http://gateway:8090/api/catalog/me
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: passly
      KEYCLOAK_ADMIN_CLIENT_ID: admin-cli
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/auth/providers || exit 1"]
      <<: *app-healthcheck

  # --- Opcionales (profile 'messaging') ---
  # RabbitMQ y booking-service viven en docker-compose.messaging.yml (overlay):
  # docker compose -f docker-compose.yml -f docker-compose.messaging.yml up
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: passly-mailhog
    profiles: ["messaging"]
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8025/api/v2/messages || exit 1"]
      <<: *healthcheck-defaults
      timeout: 5s

  # --- Opcionales (profile 'observability') ---
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: passly-prometheus
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
      <<: *healthcheck-defaults

  grafana:
    image: grafana/grafana-oss:11.6.0
    container_name: passly-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health > /dev/null || exit 1"]
      <<: *healthcheck-defaults

volumes:
  postgres-data:
  keycloak-data:
  prometheus-data:
  grafana-data:
