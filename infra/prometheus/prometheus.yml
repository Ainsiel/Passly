global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: catalog-service
    static_configs:
      - targets: ["catalog-service:8081"]

  - job_name: booking-service
    static_configs:
      - targets: ["booking-service:8082"]

  - job_name: notification-service
    static_configs:
      - targets: ["notification-service:8083"]

  - job_name: gateway
    static_configs:
      - targets: ["gateway:8090"]
