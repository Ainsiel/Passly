global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Los servicios (gateway, catalog-service, booking-service, notification-service)
  # exponen métricas de Actuator+Micrometer en /actuator/prometheus y se añadirán
  # como jobs aquí en sus respectivos tickets.
