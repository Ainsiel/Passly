name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  NODE_VERSION: "22"

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - catalog-service
          - booking-service
          - notification-service
          - gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Fix mvnw permissions
        working-directory: services/${{ matrix.service }}
        run: chmod +x ./mvnw

      - name: Build and test
        working-directory: services/${{ matrix.service }}
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports/
          retention-days: 7

  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build
        working-directory: apps/web
        run: npm run build

      - name: Lint
        working-directory: apps/web
        run: npm run lint

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build-and-test, frontend-build]
    env:
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate AUTH_SECRET if not set
        run: |
          if [ -z "$AUTH_SECRET" ]; then
            echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          fi

      - name: Create .env for infra
        working-directory: infra
        run: echo "AUTH_SECRET=${{ env.AUTH_SECRET }}" > .env

      - name: Start stack
        working-directory: infra
        run: |
          docker compose --profile messaging -f docker-compose.yml -f docker-compose.messaging.yml up -d

      - name: Wait for services to be healthy
        run: |
          SERVICES=(
            passly-postgres
            passly-keycloak
            passly-catalog
            passly-gateway
            passly-web
            passly-rabbitmq
            passly-booking
            passly-notification
            passly-mailhog
          )
          TIMEOUT=300
          ELAPSED=0
          echo "Waiting for all services to be healthy (timeout: ${TIMEOUT}s)..."
          while [ $ELAPSED -lt $TIMEOUT ]; do
            ALL_HEALTHY=true
            for svc in "${SERVICES[@]}"; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$svc" 2>/dev/null || echo "missing")
              if [ "$STATUS" != "healthy" ]; then
                ALL_HEALTHY=false
                break
              fi
            done
            if [ "$ALL_HEALTHY" = true ]; then
              echo "All services healthy."
              break
            fi
            echo "  [${ELAPSED}s] Waiting... (last checked: $svc=$STATUS)"
            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done
          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "Timeout waiting for services. Current status:"
            for svc in "${SERVICES[@]}"; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$svc" 2>/dev/null || echo "missing")
              echo "  $svc: $STATUS"
            done
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: apps/web
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Teardown
        if: always()
        working-directory: infra
        run: docker compose --profile messaging -f docker-compose.yml -f docker-compose.messaging.yml down -v
