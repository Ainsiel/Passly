name: QA

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  JAVA_VERSION: "25"
  NODE_VERSION: "22"

jobs:
  qa:
    name: QA Ephemeral
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate AUTH_SECRET if not set
        run: |
          if [ -z "$AUTH_SECRET" ]; then
            echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          fi

      - name: Create .env for infra
        working-directory: infra
        run: echo "AUTH_SECRET=${{ env.AUTH_SECRET }}" > .env

      - name: Start full stack
        working-directory: infra
        run: |
          docker compose -f docker-compose.yml -f docker-compose.messaging.yml \
            --profile messaging --profile observability up -d

      - name: Wait for services to be healthy
        run: |
          SERVICES=(
            passly-postgres
            passly-keycloak
            passly-catalog
            passly-gateway
            passly-web
            passly-rabbitmq
            passly-booking
            passly-notification
            passly-mailhog
            passly-prometheus
            passly-grafana
          )
          TIMEOUT=300
          ELAPSED=0
          echo "Waiting for all services to be healthy (timeout: ${TIMEOUT}s)..."
          while [ $ELAPSED -lt $TIMEOUT ]; do
            ALL_HEALTHY=true
            for svc in "${SERVICES[@]}"; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$svc" 2>/dev/null || echo "missing")
              if [ "$STATUS" != "healthy" ]; then
                ALL_HEALTHY=false
                break
              fi
            done
            if [ "$ALL_HEALTHY" = true ]; then
              echo "All services healthy."
              break
            fi
            echo "  [${ELAPSED}s] Waiting... (last checked: $svc=$STATUS)"
            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done
          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "Timeout waiting for services. Current status:"
            for svc in "${SERVICES[@]}"; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$svc" 2>/dev/null || echo "missing")
              echo "  $svc: $STATUS"
            done
            exit 1
          fi

      - name: Run smoke tests
        run: |
          chmod +x scripts/smoke.sh
          bash scripts/smoke.sh | tee smoke-results.txt

      # ── k6 load testing ──────────────────────────────────────────

      - name: Seed k6 test data
        run: |
          chmod +x tests/k6/seed.sh
          bash tests/k6/seed.sh

      - name: Install k6
        run: |
          curl -sS https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | \
            sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install k6 -y

      - name: Run k6 benchmark
        run: |
          mkdir -p artifacts/k6
          k6 run tests/k6/benchmark.js \
            --summary-export=artifacts/k6/benchmark-summary.json \
            --out json=artifacts/k6/benchmark.json || true

      - name: Run k6 spike
        run: |
          k6 run tests/k6/spike.js \
            --summary-export=artifacts/k6/spike-summary.json \
            --out json=artifacts/k6/spike.json || true

      - name: Run k6 concurrency
        run: |
          k6 run tests/k6/concurrency.js \
            --summary-export=artifacts/k6/concurrency-summary.json \
            --out json=artifacts/k6/concurrency.json || true

      - name: Run k6 soak (5 min)
        run: |
          k6 run tests/k6/soak.js \
            --summary-export=artifacts/k6/soak-summary.json \
            --out json=artifacts/k6/soak.json || true

      - name: Generate k6 HTML report
        if: always()
        run: |
          python3 tests/k6/generate-report.py artifacts/k6/ > artifacts/k6/report.html || echo "Report generation skipped"

      - name: Upload k6 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-reports
          path: artifacts/k6/
          retention-days: 30

      # ── Frontend / E2E ───────────────────────────────────────────

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: apps/web
        run: npx playwright test

      - name: Collect Prometheus metrics
        if: always()
        run: |
          mkdir -p artifacts/prometheus
          curl -s http://localhost:9090/api/v1/metrics > artifacts/prometheus/metrics.txt || echo "Prometheus not available"

      - name: Collect Grafana dashboards
        if: always()
        run: |
          mkdir -p artifacts/grafana
          GRAFANA_AUTH=$(echo -n "admin:admin" | base64)
          # List and export all provisioned dashboards
          DASHBOARDS=$(curl -s -H "Authorization: Basic $GRAFANA_AUTH" \
            http://localhost:3001/api/search?type=dash-db 2>/dev/null || echo "[]")
          echo "$DASHBOARDS" | python3 -c "
          import sys, json
          dashboards = json.load(sys.stdin)
          for db in dashboards:
              uid = db.get('uid', '')
              title = db.get('title', 'unknown')
              print(f'{uid}|{title}')
          " 2>/dev/null | while IFS='|' read -r uid title; do
            if [ -n "$uid" ]; then
              curl -s -H "Authorization: Basic $GRAFANA_AUTH" \
                "http://localhost:3001/api/dashboards/uid/$uid" \
                > "artifacts/grafana/${uid}.json" 2>/dev/null
              echo "Exported dashboard: $title ($uid)"
            fi
          done || echo "Grafana not available or no dashboards found"

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: smoke-results.txt
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          retention-days: 7

      - name: Upload Prometheus metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prometheus-metrics
          path: artifacts/prometheus/
          retention-days: 7

      - name: Upload Grafana dashboards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grafana-dashboards
          path: artifacts/grafana/
          retention-days: 7

      - name: Teardown
        if: always()
        working-directory: infra
        run: |
          docker compose -f docker-compose.yml -f docker-compose.messaging.yml \
            --profile messaging --profile observability down -v
