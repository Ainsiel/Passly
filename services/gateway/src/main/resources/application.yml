spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: catalog
              uri: ${PASSLY_CATALOG_URI:http://localhost:8081}
              predicates:
                - Path=/api/catalog/**
              filters:
                - StripPrefix=2
            - id: booking
              uri: ${PASSLY_BOOKING_URI:http://localhost:8082}
              predicates:
                - Path=/api/booking/**
              filters:
                - StripPrefix=2

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info
